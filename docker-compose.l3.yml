services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${L3_SQLSERVER_SA_PASSWORD:?Set L3_SQLSERVER_SA_PASSWORD in .env.l3}
    ports:
      - "127.0.0.1:14333:1433"
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -Q "SELECT 1"
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 20s
